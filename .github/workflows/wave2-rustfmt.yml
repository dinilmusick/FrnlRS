name: Wave 2 rustfmt branch repair
on:
  push:
    branches:
      - feat/headless-semantic-runtime-wave2-20261121
permissions:
  contents: write
concurrency:
  group: frnlrs-wave2-formatter
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust source
        run: cargo fmt --all
      - name: Verify expected branch and push non-force fast-forward formatting commit
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: apply rustfmt to Wave 2 semantic runtime"
          REMOTE_HEAD="$(git ls-remote origin refs/heads/feat/headless-semantic-runtime-wave2-20261121 | awk '{print $1}')"
          test "$REMOTE_HEAD" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/feat/headless-semantic-runtime-wave2-20261121
