name: Rust semantic surface parity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify semantic UI contracts
        run: cargo test --all-targets
      - name: Verify original native consumer
        run: cargo run --example native_consumer
      - name: Verify headless semantic consumer
        run: cargo run --example semantic_consumer
      - name: Compile portable WASI target
        run: |
          rustup target add wasm32-wasip1
          cargo check --target wasm32-wasip1
      - name: Enforce idiomatic Rust warnings
        run: cargo clippy --all-targets -- -D warnings
