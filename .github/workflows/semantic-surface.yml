name: Rust semantic surface parity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify semantic UI contracts
        run: cargo test --all-targets
      - name: Verify native consumer integration
        run: cargo run --example native_consumer
      - name: Enforce idiomatic Rust warnings
        run: cargo clippy --all-targets -- -D warnings
